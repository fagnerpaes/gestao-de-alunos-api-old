name: Testes de API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Subir servidor da API
        run: |
          node src/server.js &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000/api/auth/login; then
              echo "API pronta"
              exit 0
            fi
            sleep 1
          done
          echo "API não respondeu a tempo" >&2
          exit 1
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test      

      - name: Executar testes
        run: npm test
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test
